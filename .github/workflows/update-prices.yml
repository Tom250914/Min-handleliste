name: Oppdater butikkpriser

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test prisbehandling
        run: node --test
      - name: Hent og valider priser
        env:
          KASSALAPP_API_KEY: ${{ secrets.KASSALAPP_API_KEY }}
        run: node scripts/update-prices.cjs
      - name: Publiser bare prisfilen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- data/prices.json; then
            exit 0
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/data/prices.json?ref=main" --jq .sha)
          jq -n --arg sha "$sha" --rawfile content data/prices.json \
            '{message: "chore: oppdater kildebaserte priser", branch: "main", sha: $sha, content: ($content | @base64)}' |
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/data/prices.json" --input - --silent
          # GITHUB_TOKEN commits do not automatically rebuild branch-based Pages.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
